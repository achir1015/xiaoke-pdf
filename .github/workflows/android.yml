# Android App 自動編譯（不用 Gradle，執行 build.py）
#
# 比喻：GitHub 的主機像一間「代工廠」，已經裝好 Android SDK。
# 每次 Android 程式有更新，就在那裡編譯 APK：
#   - 有設定簽章金鑰（Secrets 裡的 XIAOKEPDF_KEYSTORE_BASE64）：
#       用你自己的金鑰簽章 → 更新 release/XiaoKePdf.apk → 建立／更新 GitHub Release，
#       手機 App 裡「檢查更新」就會看到新版，可以直接覆蓋安裝。
#   - 沒有設定金鑰：只確認程式能編譯，APK 放在這次執行的 Artifacts 供測試，
#       不會發佈（用別的金鑰簽的 APK 不能覆蓋安裝舊版）。
#
# 設定金鑰（只要做一次）：在有 xiaokepdf.jks 的電腦上執行
#   Windows PowerShell： [Convert]::ToBase64String([IO.File]::ReadAllBytes("xiaokepdf.jks")) | Set-Clipboard
#   macOS / Linux：      base64 -w0 xiaokepdf.jks   （macOS 用 base64 -i xiaokepdf.jks）
# 再到 GitHub 倉庫 Settings → Secrets and variables → Actions → New repository secret，
# 名稱填 XIAOKEPDF_KEYSTORE_BASE64，內容貼上剛剛複製的文字。
name: 編譯 Android App

on:
  push:
    branches: [main, 'android-**']
    paths:
      - 'src/**'
      - 'res/**'
      - 'assets/**'
      - 'libs/**'
      - 'AndroidManifest.xml'
      - 'build.py'
      - 'release/RELEASE_NOTES.md'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 讀取版本號
        run: |
          VER=$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "版本 v$VER"

      - name: 設定 SDK 位置
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "jdk.dir=$JAVA_HOME" >> local.properties
          echo "build-tools：$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
          echo "platforms：$(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: 還原簽章金鑰
        env:
          KEYSTORE: ${{ secrets.XIAOKEPDF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > xiaokepdf.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "使用倉庫 Secrets 裡的簽章金鑰"
          else
            echo "::warning title=沒有簽章金鑰::只檢查能否編譯，不會發佈。請在 Settings → Secrets → Actions 新增 XIAOKEPDF_KEYSTORE_BASE64（作法見 android.yml 開頭的說明）"
          fi

      - name: 編譯 APK
        run: python3 build.py

      - name: 上傳測試用 APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoKePdf-v${{ env.VER }}${{ env.SIGNED != '1' && '-未簽正式金鑰' || '' }}
          path: build/XiaoKePdf.apk
          retention-days: 14

      - name: 發佈到 release/ 與 GitHub Releases
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/XiaoKePdf.apk release/XiaoKePdf.apk
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add release/XiaoKePdf.apk
          if ! git diff --cached --quiet; then
            git commit -m "發佈 Android App v$VER（GitHub Actions 自動編譯）"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          NOTES=release/RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "v$VER" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" release/XiaoKePdf.apk --clobber
            gh release edit "v$VER" --notes-file "$NOTES"
          else
            gh release create "v$VER" release/XiaoKePdf.apk --title "小柯文件PDF助手 v$VER" --notes-file "$NOTES" --latest
          fi
